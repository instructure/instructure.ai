name: Deploy Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CI: 1
  UPDATE: 1

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes affecting apps
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip_steps=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            DIFF_RANGE="$BEFORE_SHA $AFTER_SHA"
          else
            DIFF_RANGE="HEAD~1 HEAD"
          fi
          if ! git diff --name-only $DIFF_RANGE | grep -E '^(apps/|packages/|plugins/|scripts/|types/|public/|package.json$|pnpm-.*|tsconfig.*|vite.*|\.oxlintrc.*|\.node-version$|\.github/workflows/deploy-apps.yml$)' ; then
            echo "No changes affecting apps. Exiting early."
            echo "skip_steps=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_steps=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.changes.outputs.skip_steps != 'true'
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node (v26) with pnpm cache
        if: steps.changes.outputs.skip_steps != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            **/pnpm-lock.yaml

      - name: Ensure pnpm store exists for caching
        if: steps.changes.outputs.skip_steps != 'true'
        shell: bash
        run: |
          STORE="$(pnpm store path)"
          echo "pnpm store path: $STORE"
          mkdir -p "$STORE"

      - name: Install dependencies
        if: steps.changes.outputs.skip_steps != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build apps
        if: steps.changes.outputs.skip_steps != 'true'
        run: pnpm exec vp run build:apps

      - name: Typecheck
        if: steps.changes.outputs.skip_steps != 'true'
        run: pnpm exec vp run typecheck:all

      - name: Test Canvas MCP
        if: steps.changes.outputs.skip_steps != 'true'
        run: pnpm --filter @instructure.ai/canvas-mcp test

      - name: Setup Pages
        if: steps.changes.outputs.skip_steps != 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.changes.outputs.skip_steps != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"
          # Preserve v3 behavior: include dotfiles in the deployed site.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.skip_steps != 'true'
        id: deployment
        uses: actions/deploy-pages@v5
