name: Validate Workspace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run typecheck:all
      - name: Check formatting, lint, and types
        run: pnpm exec vp check
      - name: Test root and all workspaces
        run: pnpm exec vp run test:all
      - name: Build library without refreshing remote data
        run: pnpm exec vp run @instructure.ai/aiinfo#build:lib
      - name: Build apps
        run: pnpm exec vp run build:apps
  aiinfo-consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.0.0", "20", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run @instructure.ai/aiinfo#build:lib
      - name: Prepare packed consumer under Node 26
        run: pnpm exec vpx scripts/prepareConsumer.mts "$RUNNER_TEMP/aiinfo-consumer"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Execute published exports without development tooling
        run: node "$RUNNER_TEMP/aiinfo-consumer/consumer.mjs"
